[project]
name = "atlas-workstation"
version = "0.1.0"
description = "Streamlit workstation for exploring Atlas Markets service APIs"
requires-python = ">=3.12,<3.13"
dependencies = [
    "atlas-telemetry",
    "httpx>=0.28,<0.29",
    "opentelemetry-api>=1.30,<2",
    "opentelemetry-sdk>=1.30,<2",
    "python-dotenv>=1.1,<2",
    "streamlit>=1.46,<2",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atlas_workstation"]

[tool.uv.sources]
atlas-telemetry = { workspace = true }

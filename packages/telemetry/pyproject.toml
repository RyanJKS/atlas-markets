[project]
name = "atlas-telemetry"
version = "0.1.0"
description = "Shared logging, tracing, and metrics for Atlas Markets"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "opentelemetry-api>=1.30,<2",
    "opentelemetry-sdk>=1.30,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.30,<2",
    "opentelemetry-exporter-prometheus>=0.60b0,<1",
    "azure-monitor-opentelemetry-exporter>=1.0.0b1,<2",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atlas_telemetry"]

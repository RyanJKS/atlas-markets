name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Install development tools
        run: |
          python -m pip install uv==0.7.13
          uv sync --locked --all-packages --group docs
      - name: Run pre-commit checks
        run: uv run --no-sync pre-commit run --all-files --show-diff-on-failure
      - name: Check Python workspace
        run: |
          uv run --no-sync ruff check .
          uv run --no-sync ruff format --check .
          uv run --no-sync pytest
      - name: Compile Python source
        run: python -m compileall -q apps services packages
      - name: Validate local container configuration
        run: |
          docker compose -f infrastructure/compose.yaml config --quiet
          docker compose -f infra/telemetry-docker-compose.yaml config --quiet
      - name: Build TechDocs
        run: uv run --no-sync mkdocs build --strict --site-dir "$RUNNER_TEMP/atlas-techdocs"

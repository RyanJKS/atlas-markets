name: atlas-telemetry

services:
  grafana:
    image: grafana/grafana:12.0.0
    ports:
      - "127.0.0.1:${ATLAS_GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./telemetry/grafana-datasources.yaml:/etc/grafana/provisioning/datasources/atlas.yaml:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
      - jaeger
      - tempo

  prometheus:
    image: prom/prometheus:v3.5.0
    ports:
      - "127.0.0.1:${ATLAS_PROMETHEUS_PORT:-9090}:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./telemetry/prometheus.yaml:/etc/prometheus/prometheus.yml:ro # :ro == read only volume
      - prometheus-data:/prometheus

  alloy:
    image: grafana/alloy:v1.20.0
    ports:
      - "127.0.0.1:${ATLAS_OTLP_GRPC_PORT:-4317}:4317"
      - "127.0.0.1:${ATLAS_OTLP_HTTP_PORT:-4318}:4318"
    command:
      - run
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./telemetry/config.alloy:/etc/alloy/config.alloy:ro
      - ./telemetry/logs:/var/log/atlas:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
    depends_on:
      - loki
      - jaeger
      - tempo

  loki:
    image: grafana/loki:3.7.0
    ports:
      - "127.0.0.1:${ATLAS_LOKI_PORT:-3100}:3100"
    volumes:
      - loki-data:/loki

  jaeger:
    image: jaegertracing/all-in-one:1.76.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "127.0.0.1:${ATLAS_JAEGER_UI_PORT:-16686}:16686"

  tempo:
    image: grafana/tempo:2.9.0
    # Local development: allow Tempo to initialize its named volume.
    user: "0:0"
    command: ["-config.file=/etc/tempo.yaml"]
    ports:
      - "127.0.0.1:${ATLAS_TEMPO_PORT:-3200}:3200"
    volumes:
      - ./telemetry/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo

volumes:
  grafana-data:
  prometheus-data:
  alloy-data:
  loki-data:
  tempo-data:

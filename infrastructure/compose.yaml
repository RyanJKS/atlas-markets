name: atlas-markets

services:
  market-data:
    build:
      context: ..
      dockerfile: services/market-data/Dockerfile
    ports:
      - "127.0.0.1:8001:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  fraud-detection:
    build:
      context: ..
      dockerfile: services/fraud-detection/Dockerfile
    ports:
      - "127.0.0.1:8002:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
